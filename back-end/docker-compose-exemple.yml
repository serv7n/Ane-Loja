services:
  app:
    build: .
    container_name: ane_loja
    ports:
      - "8089:8080"
    environment:
      CLOUDINARY_URL:
      DB_URL: jdbc:postgresql://postgres:5435/aneloja
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: ane_loja_postgres
    environment:
      POSTGRES_DB: aneloja
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - /banco/postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: